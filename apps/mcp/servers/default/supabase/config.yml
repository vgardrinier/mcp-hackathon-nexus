id: supabase-mcp-server
name: Supabase
description: Query and manage Supabase databases
category: official
logoUrl: https://supabase.com/favicon.ico

requiresAuth: true

env:
  - key: SUPABASE_ACCESS_TOKEN
    name: Supabase Personal Access Token
    required: true
    valueFromEnv: SUPABASE_ACCESS_TOKEN

config:
  transport: stdio
  command: npx
  args:
    - "-y"
    - "@supabase/mcp-server-supabase"
