services:
  edison:
    image: python:3.12-slim
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq curl &&
      pip install --quiet open-edison &&
      open-edison --host 0.0.0.0 --port 4000"
    environment:
      OPEN_EDISON_SKIP_TUI: "true"
      PYTHONUNBUFFERED: "1"
    ports:
      - "4000:4000"
      - "4001:4001"
    volumes:
      - ~/.config/nexus/edison:/root/.config/open-edison
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    command: >
      sh -c "pnpm install --frozen-lockfile
      && pnpm --filter nexus-dashboard dev --hostname 0.0.0.0 --port 3000"
    environment:
      CHOKIDAR_USEPOLLING: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - dashboard_node_modules:/app/node_modules
      - pnpm-store:/root/.local/share/pnpm
      - ~/.config/nexus:/root/.config/nexus
    restart: "no"

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    command: >
      sh -c "sleep 5 && pnpm install --frozen-lockfile
      && pnpm dev:mcp:http"
    environment:
      ALLOW_UNAUTHENTICATED_MCP: "true"
      EDISON_ENABLED: "false"
      EDISON_URL: "http://edison:4000"
      EDISON_API_KEY: "dev-api-key-change-me"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - mcp_node_modules:/app/node_modules
      - pnpm-store:/root/.local/share/pnpm
      - ~/.config/nexus:/root/.config/nexus
    restart: "no"

volumes:
  dashboard_node_modules:
  mcp_node_modules:
  pnpm-store:
